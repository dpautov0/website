can<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>hello vicky</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #161616;
    --fg: #f4f4f5;
    --fg-dim: #8a8a90;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.003em;
    overflow: hidden;
    overscroll-behavior: none;
  }

  .slide {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: 0;
    transition: opacity 200ms ease, visibility 0s linear 200ms;
  }
  .slide.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    z-index: 1;
    transition: opacity 200ms ease, visibility 0s linear 0s;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: calc(env(safe-area-inset-top) + 1.5rem) 1.25rem 0.5rem;
    text-align: center;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* keep long lines inside the viewport; images keep their own 80vw cap */
  .big, .lines, .note { max-width: 100%; overflow-wrap: break-word; }

  .actions {
    display: flex;
    justify-content: center;
    gap: 2.5rem;
    padding: 0.5rem 1.25rem calc(env(safe-area-inset-bottom) + 2rem);
  }

  .big {
    font-size: clamp(1.75rem, 9vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.25;
    color: #ffffff;
  }

  .lines { display: flex; flex-direction: column; }
  .line {
    font-size: clamp(1.25rem, 6.5vw, 2rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.35;
    color: #ffffff;
  }

  .note {
    font-size: clamp(0.8125rem, 3.6vw, 1rem);
    color: var(--fg-dim);
    line-height: 1.5;
  }

  .btn {
    font: inherit;
    font-size: clamp(1rem, 4.5vw, 1.125rem);
    letter-spacing: -0.003em;
    background: none;
    border: 0;
    padding: 0.75rem 1rem;
    color: var(--fg-dim);
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
    transition: color 120ms ease, opacity 200ms ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn:hover { color: var(--fg); }

  img { display: block; max-width: 80vw; height: auto; }

  /* let the burst spill past the content box; .slide clips it at the viewport */
  #s2 .content { overflow: visible; }

  #vickywrap { position: relative; width: min(80vw, 55vh); }
  #vicky { width: 100%; }

  #bridge { max-height: 32vh; }

  /* centred on the photo, not the viewport, so the boom lands on her.
     contain keeps the whole burst; 185% so it covers the square vertically */
  #explosion {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 185%;
    height: 185%;
    transform: translate(-50%, -50%);
    object-fit: contain;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
  }
</style>
</head>
<body>

  <section class="slide active" id="s1">
    <div class="content"><p class="big">hello vicky</p></div>
    <div class="actions"><button class="btn" id="start" data-advance>next -&gt;</button></div>
  </section>

  <section class="slide" id="s2">
    <div class="content"><div id="vickywrap"><img id="vicky" src="vicky.jpg" alt="" /></div></div>
    <div class="actions"><button class="btn" id="afterBoom" data-advance>next -&gt;</button></div>
  </section>

  <section class="slide" id="s3">
    <div class="content"><p class="big">i have an idea</p></div>
    <div class="actions"><button class="btn" data-advance>next -&gt;</button></div>
  </section>

  <section class="slide" id="s4">
    <div class="content">
      <div class="lines">
        <p class="line">sunday</p>
        <p class="line">10am</p>
        <p class="line">kickapoo rail trail, 12 miles. i drive</p>
      </div>
      <img id="bridge" src="bridge.jpg" alt="" />
      <p class="note">(you will be extra tired for water polo @ 5)</p>
    </div>
    <div class="actions">
      <button class="btn" id="yes">yes</button>
      <button class="btn" id="no">no</button>
    </div>
  </section>

  <section class="slide" id="s5">
    <div class="content">
      <p class="big">see you sunday</p>
      <a class="btn" id="cal" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=hike%20with%20dmitriy&amp;dates=20260913T150000Z/20260913T193000Z&amp;details=kickapoo%20rail%20trail%2C%2012%20miles.%20he%20drives.&amp;location=Weaver%20Park%2C%202205%20E%20Main%20St%2C%20Urbana%2C%20IL" target="_blank" rel="noopener noreferrer">add to calendar</a>
      <p class="note">(so you are extra tired for practice @ 5)</p>
    </div>
  </section>

<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var idx = 0;

  function show(n) {
    if (n < 0 || n >= slides.length || n === idx) return;
    if (slides[idx].id === 's2') stopBooms();
    slides[idx].classList.remove('active');
    slides[n].classList.add('active');
    idx = n;
    if (slides[n].id === 's2') startBooms();
  }
  function next() { show(idx + 1); }

  /* one looping boom track; stays silent if boom.mp3 isn't there */
  var boom = new Audio('boom.mp3');
  boom.preload = 'auto';
  boom.loop = true;

  var video = document.createElement('video');
  video.id = 'explosion';
  video.src = 'explosion.mp4';
  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;
  video.loop = true;
  video.preload = 'auto';
  video.setAttribute('muted', '');
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  document.getElementById('vickywrap').appendChild(video);

  function play(el) {
    try { el.currentTime = 0; } catch (e) {}
    var p = el.play();
    if (p && p['catch']) p['catch'](function () {});
  }

  /* booms run for as long as slide 2 is up. startBooms() is reached
     synchronously from the slide 1 click, which is what lets iOS start media. */
  function startBooms() {
    video.style.opacity = '1';
    play(video);
    play(boom);
  }

  function stopBooms() {
    video.style.opacity = '0';
    try { video.pause(); } catch (e) {}
    try { boom.pause(); boom.currentTime = 0; } catch (e) {}
  }

  Array.prototype.forEach.call(
    document.querySelectorAll('#s1 [data-advance], #s2 [data-advance], #s3 [data-advance]'),
    function (b) { b.addEventListener('click', next); }
  );

  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var noIsYes = false;
  var converting = false;

  yes.addEventListener('click', function () { show(4); });
  no.addEventListener('click', function () {
    if (noIsYes) { show(4); return; }
    if (converting) return;
    converting = true;
    no.textContent = 'wrong choice';
    setTimeout(function () {
      no.textContent = 'yes';
      noIsYes = true;
      converting = false;
    }, 800);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== 'ArrowRight') return;
    /* let a focused button handle its own Enter */
    if (e.key === 'Enter' && e.target && e.target.closest && e.target.closest('button, a')) return;
    var btn = slides[idx].querySelector('[data-advance]');
    if (btn) { e.preventDefault(); btn.click(); }
  });
})();
</script>
</body>
</html>
