<style>
  /* economics graphs: shaded areas and extra curve colors (work in light and dark) */
  .schem .cs { fill: var(--accent); fill-opacity: .26; stroke: none; }
  .schem .ex { fill: var(--dim); fill-opacity: .22; stroke: none; }
  .schem .loss { fill: #e5484d; fill-opacity: .30; stroke: none; }
  .schem .gain { fill: #30a46c; fill-opacity: .30; stroke: none; }
  .schem .curve.c2 { stroke: #e8833a; }
  .schem .curve.c3 { stroke: #30a46c; }
  .schem .curve.c4 { stroke: #8e4ec6; }
  .schem .curve.c5 { stroke: #e5484d; }
  .schem .guide { stroke: var(--dim); stroke-width: 1; stroke-dasharray: 3 3; }
  .schem .ptdot { fill: var(--fg); stroke: none; }
  .tbl-tight td, .tbl-tight th { padding: 4px 8px; }
</style>
<script>try { var t = localStorage.getItem('ace300.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
